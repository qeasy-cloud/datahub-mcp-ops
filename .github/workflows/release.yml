name: release

# Publishes a GitHub Release for a pushed tag, using the repository's own
# GITHUB_TOKEN. No personal access token is required.
#
# Notes come from docs/release-notes/<tag>.md when present; otherwise GitHub
# generates them from the commit history.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -f "docs/release-notes/$TAG.md" ]; then
            echo "notes=docs/release-notes/$TAG.md" >> "$GITHUB_OUTPUT"
          else
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distributable archive
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          git archive --format=zip --prefix="datahub-mcp-ops-${TAG}/" \
            -o "dist/datahub-mcp-ops-${TAG}.zip" "$TAG"
          ls -l dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists, uploading assets"
            gh release upload "$TAG" dist/*.zip --clobber
          else
            if [ -n "$NOTES" ]; then
              gh release create "$TAG" dist/*.zip \
                --title "$TAG" --notes-file "$NOTES" --verify-tag
            else
              gh release create "$TAG" dist/*.zip \
                --title "$TAG" --generate-notes --verify-tag
            fi
          fi
