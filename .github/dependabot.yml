version: 2

updates:
  # GitHub Actions are pinned deliberately. Dependabot's registry currently
  # proposes non-existent majors (checkout@v7 etc.), so only allow
  # minor/patch bumps.
  #
  # No pip ecosystem: the scripts use the Python standard library only, and a
  # pip update job without a requirements file fails on every run.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    labels:
      - docs
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
